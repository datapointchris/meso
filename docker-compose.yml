# Production stack, as the template each release renders.
#
# A host runs the release's deploy directory, ghcr.io/datapointchris/meso/deploy
# at the release's version, rather than this file. The release writes that copy
# with each `:latest` image line below replaced by the digest it pushed, so the
# running images never move under a tag. release/push-deploy-directory matches
# each `image:` line whole, so a comment never goes on one.
#
# Pulls images from ghcr.io built and pushed by CI. No `build:` directives, so a
# host runs exactly the images CI built and any container runtime can run them
# unchanged. Secrets and runtime config come from env files in /etc/meso/
# (deployed out-of-band; never committed).
#
# For local development, use docker-compose.dev.yml instead.

name: meso

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /etc/meso/.env.postgres
    volumes:
      - /var/db/meso-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meso -d meso']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/datapointchris/meso-api:latest
    restart: unless-stopped
    env_file: /etc/meso/.env.api
    # The host's trace collector listens on the docker bridge, which host-gateway names.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # The address the edge serves this API at. Its RFC 9728 metadata names it,
      # and a CLI logging in refuses that document unless it matches exactly.
      PUBLIC_URL: https://meso.ichrisbirch.com
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8088/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ghcr.io/datapointchris/meso-web:latest
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
