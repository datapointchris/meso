version: '3'

vars:
  # git describe returns the prefixed tag (cli/v0.2.0-3-gabc1234), and that is
  # what gets injected on purpose: it is not a semantic version, so a locally
  # built binary reports itself as a development build and `meso update`
  # refuses to replace it. Only CI strips the prefix, so only a released binary
  # can self-update — which is the intended split. Run the dev version from the
  # repo; install the released one.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # ~/.local/bin is where the released binary lives and precedes ~/go/bin on
  # PATH, so a dev build written to $GOBIN would sit behind the release.
  INSTALL_DIR: '{{.HOME}}/.local/bin'
  DB_DEV: postgres://meso:meso@localhost:5459/meso?sslmode=disable

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. web's
  # dependencies come back from the lockfile; .planning has no manifest and is
  # recreated from wherever the primary points. PRIMARY is derived rather than
  # configured — a worktree shares the primary's git directory, so this resolves
  # from anywhere and no-ops when run in the primary itself.
  setup:
    desc: Make a fresh checkout runnable
    vars:
      PRIMARY:
        sh: git rev-parse --path-format=absolute --git-common-dir | sed 's|/\.git$||'
    cmds:
      - npm ci --prefix web
      - ln -sfn "$(readlink {{.PRIMARY}}/.planning)" .planning

  # ---------------------------------------------------------------------------
  # CLI (meso) — module github.com/datapointchris/meso/cli
  # ---------------------------------------------------------------------------

  cli:build:
    desc: Build the meso CLI to bin/meso
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/meso/cli/internal/cli.version={{.VERSION}}" -o ../bin/meso .

  cli:install:
    desc: Build the meso CLI into ~/.local/bin, replacing the installed release
    dir: cli
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - go build -ldflags "-s -w -X github.com/datapointchris/meso/cli/internal/cli.version={{.VERSION}}" -o {{.INSTALL_DIR}}/meso .
      - 'echo "installed meso {{.VERSION}} -> {{.INSTALL_DIR}}/meso"'

  cli:test:
    desc: Run the CLI test suite
    dir: cli
    cmds:
      - go test ./...

  cli:lint:
    desc: Vet the CLI and fail on unformatted files
    dir: cli
    cmds:
      - go vet ./...
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"; echo "$unformatted"; exit 1
        fi

  cli:format:
    desc: Format the CLI sources
    dir: cli
    cmds:
      - gofmt -w .

  # ---------------------------------------------------------------------------
  # API — module meso/api
  # ---------------------------------------------------------------------------

  api:test:
    desc: Run the API test suite (provisions Postgres via testcontainers)
    dir: api
    cmds:
      - go test ./...

  api:lint:
    desc: Vet the API and fail on unformatted files
    dir: api
    cmds:
      - go vet ./...
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"; echo "$unformatted"; exit 1
        fi

  api:format:
    desc: Format the API sources
    dir: api
    cmds:
      - gofmt -w .

  api:dev:
    desc: Run the API from source in the foreground, against the dev database
    dir: api
    cmds:
      - DATABASE_URL={{.DB_DEV}} go run .

  dev-db:seed:
    desc: Load the FK-backbone lookups into the dev database (idempotent)
    dir: api
    cmds:
      - DATABASE_URL={{.DB_DEV}} go run ./cmd/seed

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------

  web:dev:
    desc: Start the Vite dev server
    dir: web
    cmds:
      - npm run dev

  web:build:
    desc: Typecheck and build the SPA
    dir: web
    cmds:
      - npm run build

  web:test:
    desc: Run the web unit tests
    dir: web
    cmds:
      - npm run test

  web:lint:
    desc: Lint and format-check the SPA
    dir: web
    cmds:
      - npm run lint
      - npm run format:check

  web:format:
    desc: Format the SPA sources
    dir: web
    cmds:
      - npm run format

  # ---------------------------------------------------------------------------
  # Aggregate
  # ---------------------------------------------------------------------------

  lint:
    desc: Lint every subsystem
    cmds:
      - task: api:lint
      - task: cli:lint
      - task: web:lint

  format:
    desc: Format every subsystem
    cmds:
      - task: api:format
      - task: cli:format
      - task: web:format

  test:
    desc: Test every subsystem
    cmds:
      - task: api:test
      - task: cli:test
      - task: web:test
