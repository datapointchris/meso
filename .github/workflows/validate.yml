# forge-toolchain: 11
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:

      - uses: actions/checkout@v7

      # generated:go-api
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "api/go.mod"

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run

      # Two advisories found by hand on 2026-07-26 that this would have caught:
      # GO-2026-5932 (x/crypto/openpgp, unmaintained and unfixed) reached three
      # repos through go-selfupdate, and GO-2026-5856 (crypto/tls) shipped
      # because a stale `go` directive picks the toolchain that compiles the
      # binary, so the stdlib goes stale with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  go-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:

      - uses: actions/checkout@v7

      # generated:go-cli
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "cli/go.mod"

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run

      # Two advisories found by hand on 2026-07-26 that this would have caught:
      # GO-2026-5932 (x/crypto/openpgp, unmaintained and unfixed) reached three
      # repos through go-selfupdate, and GO-2026-5856 (crypto/tls) shipped
      # because a stale `go` directive picks the toolchain that compiles the
      # binary, so the stdlib goes stale with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  vue-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:

      - uses: actions/checkout@v7

      # generated:vue-web
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          cache-dependency-path: "web/package-lock.json"

      - run: npm ci

      # Not every frontend defines lint yet; --if-present keeps the rollout
      # from hard-failing on a missing script.
      - run: npm run lint --if-present

      - run: npm run build
