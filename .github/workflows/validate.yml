# forge-toolchain: 20
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:

      - uses: actions/checkout@v7

      # generated:go-api
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "api/go.mod"
          cache: true

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  go-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:

      - uses: actions/checkout@v7

      # generated:go-cli
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "cli/go.mod"
          cache: true

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  vue-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:

      - uses: actions/checkout@v7

      # generated:vue-web
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # A glob rather than web/package-lock.json, because the two
          # layouts in use keep the lock in different places: one lock per
          # component beside its package.json, or an npm workspace with a
          # single lock at the repo root. setup-node fails outright when a
          # named path does not resolve, so a workspace component with no lock
          # of its own kills the job before npm ci.
          #
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this is not relative to the component.
          cache-dependency-path: "**/package-lock.json"

      # An npm workspace has to install from the root: the lock covers every
      # workspace, and npm ci inside one refuses to run without a lock beside
      # it. Falling back keeps the per-component layout installing in place.
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            cd "$GITHUB_WORKSPACE" && npm ci
          fi

      # Not every frontend defines lint yet; --if-present keeps the rollout
      # from hard-failing on a missing script.
      - run: npm run lint --if-present

      - run: npm run build
