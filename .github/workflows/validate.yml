# forge-toolchain: 27
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:

      - uses: actions/checkout@v7

      # generated:go-api
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "api/go.mod"
          cache: true
          cache-dependency-path: "api/go.sum"

      - run: go mod tidy -diff

      # gofumpt runs as itself, not as a golangci-lint formatter. That copy has
      # no module path, so it files a module's own imports with the standard
      # library's. -d prints the rewrite and exits 1 on any.
      - name: Formatting
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          gofumpt -d .

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  go-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:

      - uses: actions/checkout@v7

      # generated:go-cli
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "cli/go.mod"
          cache: true
          cache-dependency-path: "cli/go.sum"

      - run: go mod tidy -diff

      # gofumpt runs as itself, not as a golangci-lint formatter. That copy has
      # no module path, so it files a module's own imports with the standard
      # library's. -d prints the rewrite and exits 1 on any.
      - name: Formatting
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          gofumpt -d .

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  vue-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:

      - uses: actions/checkout@v7

      # generated:vue-web
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # A glob rather than web/package-lock.json, because the two
          # layouts in use keep the lock in different places: one lock per
          # component beside its package.json, or an npm workspace with a
          # single lock at the repo root. setup-node fails outright when a
          # named path does not resolve, so a workspace component with no lock
          # of its own kills the job before npm ci.
          #
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this is not relative to the component.
          cache-dependency-path: "**/package-lock.json"

      # An npm workspace has to install from the root: the lock covers every
      # workspace, and npm ci inside one refuses to run without a lock beside
      # it. Falling back keeps the per-component layout installing in place.
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            cd "$GITHUB_WORKSPACE" && npm ci
          fi

      # lint:fix, not lint, because it is the script the vue-eslint hook runs
      # and some frontends define no other. A file it rewrites is a finding the
      # hook would have fixed before the commit.
      - name: Lint
        run: |
          npm run lint:fix
          git diff --exit-code -- .

      - run: npx prettier --check .

      - run: npm run --if-present typecheck

      - run: npm run build

  hooks:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:hooks
      # The hooks no other job in this workflow runs, which forge lists below
      # from the repo's committed config. A push from a checkout that never ran
      # `pre-commit install`, or a merge in the web UI, passes every hook by not
      # running it, and this is the gate that catches both.
      - uses: astral-sh/setup-uv@v7

      # A self-hosted runner keeps ~/.cache/pre-commit between jobs, so there
      # the archive is a download of what is already on disk.
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Over what the push or pull request changed, which is what the hooks
      # would have seen at commit time. --all-files would fail a push on every
      # finding in a file it never touched, so it is the scope only where no
      # earlier commit can be fetched, as on a repo's first push.
      #
      # The checkout is one commit deep, and diffing needs one more. pre-commit
      # falls back to a two-dot diff where the two commits share no history on
      # disk, and refcheck's --moves reads the range as a two-dot diff too, so
      # the base commit alone is enough.
      - name: Run the hooks over the change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 --no-tags origin "$BASE" 2>/dev/null; then
            scope=(--from-ref "$BASE" --to-ref HEAD)
          elif git fetch --quiet --depth=2 --no-tags origin "$(git rev-parse HEAD)" &&
            git rev-parse --quiet --verify HEAD~1 >/dev/null; then
            echo "::notice::this event names no base commit, so only the head commit's change is checked"
            scope=(--from-ref HEAD~1 --to-ref HEAD)
          else
            echo "::notice::no earlier commit to diff against, so every file is checked"
            scope=(--all-files)
          fi
          hooks=(
            check-yaml
            check-toml
            check-json
            end-of-file-fixer
            trailing-whitespace
            check-executables-have-shebangs
            check-shebang-scripts-are-executable
            check-added-large-files
            check-merge-conflict
            mixed-line-ending
            check-case-conflict
            detect-private-key
            check-json5
            markdownlint
            shellcheck
            shfmt
            codespell
            refcheck
            hadolint-docker
            actionlint
            sqlfluff-lint
          )
          # Every hook runs whatever the one before it found, so one push
          # reports every failing hook rather than the first.
          status=0
          for hook in "${hooks[@]}"; do
            uvx pre-commit run "$hook" "${scope[@]}" --show-diff-on-failure || status=1
          done
          exit "$status"
