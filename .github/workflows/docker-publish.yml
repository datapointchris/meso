name: Test, then publish the web and API Docker images

# Pull requests are validated by validate.yml on its own trigger, so this
# workflow runs only where there is an image to publish.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/meso

jobs:
  # The repo's generated baseline: lint, format, typecheck, build and the
  # unit tests for web, and the Go jobs for api and cli.
  validate:
    uses: ./.github/workflows/validate.yml

  # Build and push Docker images to ghcr.io. Runs only on push to main, after
  # verification passes. Two images (web + api) — meso ships no MCP. The same
  # images run unchanged in k3s after migration.
  #
  # Deploy is automatic and lives outside this file: when this workflow finishes,
  # GitHub fires a repo `workflow_run` webhook to hooks.ichrisbirch.com/hooks/meso,
  # whose receiver on app-ops-lxc runs deploy-meso.sh (git pull + docker compose
  # pull + up -d on meso-lxc). Same pattern as nomad/learning. The "Deploy to
  # Homelab (Manual)" workflow only re-fires that webhook for a no-commit redeploy.
  #
  # The receiver deploys only when the finished workflow's path is this file's,
  # so renaming this file stops every deploy until hooks.json names the new one.
  images:
    name: Build & Push Image — ${{ matrix.service }}
    runs-on: ubuntu-26.04
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: web/Dockerfile
            context: web
          - service: api
            dockerfile: api/Dockerfile
            context: api
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two tags per build: ":latest" (docker-compose on meso-lxc today) and
      # ":sha-<7-char>" (k3s manifests later, for immutable rollouts).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
