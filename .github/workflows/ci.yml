name: Bespoke CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/meso

jobs:
  frontend:
    name: Lint, Typecheck & Build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build # vue-tsc --noEmit && vite build (typecheck + build)

  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test

  go-api:
    name: Go API — vet, fmt & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
      - name: go vet
        working-directory: api
        run: go vet ./...
      # Later phases add testcontainers-backed handler tests here; the suite
      # provisions its own Postgres, so no service container is needed.
      - name: Run Go tests
        working-directory: api
        run: go test ./...

  go-cli:
    name: Go CLI — vet, fmt & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum
      - name: gofmt
        working-directory: cli
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
      - name: go vet
        working-directory: cli
        run: go vet ./...
      # Pure Go (httptest + an in-memory keyring fake) — no Postgres, no network.
      # Not a deploy gate: the CLI ships as a local binary, not a container.
      - name: Run CLI tests
        working-directory: cli
        run: go test ./...

  # Build and push Docker images to ghcr.io. Runs only on push to main, after
  # verification passes. Two images (web + api) — meso ships no MCP. The same
  # images run unchanged in k3s after migration.
  #
  # Deploy is automatic and lives outside this file: when this workflow finishes,
  # GitHub fires a repo `workflow_run` webhook to hooks.ichrisbirch.com/hooks/meso,
  # whose receiver on app-ops-lxc runs deploy-meso.sh (git pull + docker compose
  # pull + up -d on meso-lxc). Same pattern as nomad/learning. The "Deploy to
  # Homelab (Manual)" workflow only re-fires that webhook for a no-commit redeploy.
  images:
    name: Build & Push Image — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [frontend, unit-tests, go-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: web/Dockerfile
            context: web
          - service: api
            dockerfile: api/Dockerfile
            context: api
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two tags per build: ":latest" (docker-compose on meso-lxc today) and
      # ":sha-<7-char>" (k3s manifests later, for immutable rollouts).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
