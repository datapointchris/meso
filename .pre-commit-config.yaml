fail_fast: true
default_stages: [pre-commit]

repos:
  # ============================================================
  # PHASE 1: Standard file checks
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict

  # ============================================================
  # PHASE 2: Markdown
  # ============================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # ============================================================
  # PHASE 3: Go (api + cli) — format check then vet
  # ============================================================
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: Check Go formatting (api + cli)
        entry: bash -c 'unformatted=$(gofmt -l api cli); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi'
        language: system
        pass_filenames: false
        files: '\.go$'

  # go-vet-repo-mod runs in every go.mod it finds, so it covers api/ and cli/
  # without a hook per module.
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-vet-repo-mod

  # ============================================================
  # PHASE 4: Frontend (Vue/TS) linting, formatting, unit tests
  # ============================================================
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        description: Run ESLint on Vue/TS files
        entry: bash -c 'cd web && npm run lint:fix'
        language: system
        pass_filenames: false
        files: '\.(vue|ts|mts)$'

      - id: prettier
        name: prettier
        description: Run Prettier on frontend files
        entry: bash -c 'cd web && npm run format'
        language: system
        pass_filenames: false
        files: '\.(vue|ts|mts|css|scss|json)$'

  # ============================================================
  # Conventional commits (commit-msg stage)
  # ============================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ['--strict', '--verbose']

# > custom:after:vue - Frontend unit tests
  - repo: local
    hooks:
      - id: vitest
        name: vitest unit
        description: Run Vitest unit and component tests
        entry: bash -c 'cd web && npm run test'
        language: system
        pass_filenames: false
        files: '\.(vue|ts|mts)$'

      # A malformed template expression is invisible to eslint, prettier and
      # vitest — a view with no spec is never compiled by any of them — so it
      # reached CI instead. `build` is vue-tsc plus vite, which is the only
      # local gate that compiles every SFC.
      - id: vue-build
        name: vue build
        description: Typecheck and compile every SFC
        entry: bash -c 'cd web && npm run build'
        language: system
        pass_filenames: false
        files: '\.(vue|ts|mts|scss)$'
